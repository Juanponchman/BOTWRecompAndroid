name: Build APK
on:
  push:
    branches: [package-import]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      NDK_VER: 30.0.16248370
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK pieces
        run: |
          sudo chown -R "$USER" "$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VER}" "cmake;3.30.4"
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/$NDK_VER" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_LINUX=$ANDROID_HOME/ndk/$NDK_VER" >> "$GITHUB_ENV"
      - name: Build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build pkg-config nasm
      - uses: actions/cache/restore@v4
        with:
          path: |
            android/deps/out
            android/deps/src
            android/deps/work
          key: deps-${{ hashFiles('android/deps/*.sh') }}-${{ github.run_id }}
          restore-keys: deps-${{ hashFiles('android/deps/*.sh') }}-
      - name: Native dependencies
        run: |
          set -eux
          bash android/deps/build_deps.sh
          bash android/deps/build_ffmpeg.sh
          bash android/deps/build_unicorn.sh
          bash android/deps/build_gen_deps.sh
          ls android/deps/out/fonts
      - name: Save dependency cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            android/deps/out
            android/deps/src
            android/deps/work
          key: deps-${{ hashFiles('android/deps/*.sh') }}-${{ github.run_id }}
      - name: Build the app
        working-directory: android/botwrecompandroid
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: botw-apk
          path: android/botwrecompandroid/app/build/outputs/apk/debug/*.apk
