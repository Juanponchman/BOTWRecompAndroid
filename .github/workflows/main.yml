name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive' 

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Set up Build Dependencies
      run: |
        # Make the dependency script executable
        chmod +x android/build_gamelib.sh
        
        # Create a mock dummy environment to satisfy the build script without real game files
        mkdir -p Dump/01007EF00011E000/exefs
        
        # Run the build lib script to generate fonts, third_party tools, and output objects
        cd android
        ./build_gamelib.sh ../Dump/01007EF00011E000/exefs

    - name: Make Gradle Wrapper Executable
      run: chmod +x android/botwrecompandroid/gradlew

    - name: Build Debug APK
      run: |
        cd android/botwrecompandroid
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: botw-recomp-debug-apk
        path: android/botwrecompandroid/app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
